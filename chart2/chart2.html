<meta charset="UTF-8">

  body {
    font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    margin: 0;
    background: #fafafa;
    color: #222;
  }
  header { padding: 14px 24px; background: #fff; border-bottom: 1px solid #ddd; }
  header h1 { margin: 0 0 4px 0; font-size: 18px; }
  header p { margin: 0; font-size: 13px; color: #666; }

  .toolbar {
    padding: 10px 24px;
    background: #fff;
    border-bottom: 1px solid #eee;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .toolbar button {
    font-size: 13px; padding: 6px 10px; border: 1px solid #ccc;
    border-radius: 4px; background: #fff; cursor: pointer;
  }
  .toolbar button:hover { background: #f0f0f0; }
  .toolbar .hint { color: #888; font-size: 12px; }

  #breadcrumb {
    padding: 8px 24px;
    background: #fff;
    border-bottom: 1px solid #eee;
    font-size: 13px;
  }
  #breadcrumb .crumb {
    color: #1f77b4;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 3px;
  }
  #breadcrumb .crumb:hover { background: #e8f0fe; }
  #breadcrumb .sep { color: #aaa; margin: 0 4px; }

  #legend {
    padding: 8px 24px;
    background: #fff;
    border-bottom: 1px solid #eee;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 12px;
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: default;
  }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; }

  #chart-wrap { text-align: center; padding: 16px; }
  #chart-wrap svg { background: #fff; width: 100%; height: auto; max-width: 100vh; }

  .arc { cursor: pointer; stroke: #fff; stroke-width: 1px; }
  .arc:hover { stroke: #222; stroke-width: 2px; }
  .label-hidden { display: none; }
  .label {
    font-size: 10px;
    fill: #222;
    pointer-events: none;
    paint-order: stroke;
    stroke: rgba(255,255,255,0.7);
    stroke-width: 3px;
    stroke-linejoin: round;
  }

  .pct-ring { cursor: default; }
  .pct-ring:hover { opacity: 0.8; }
  .pct-label {
    font-size: 9px;
    fill: #333;
    pointer-events: none;
    text-anchor: middle;
    paint-order: stroke;
    stroke: rgba(255,255,255,0.8);
    stroke-width: 2px;
    stroke-linejoin: round;
  }

  #center-info {
    font-size: 12px;
    fill: #333;
    pointer-events: none;
    text-anchor: middle;
  }
  #center-info .title { font-size: 15px; font-weight: bold; }
  #center-info .value { font-size: 13px; fill: #666; }

  #tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 12px;
    line-height: 1.5;
    max-width: 240px;
    visibility: hidden;
    z-index: 10;
  }
  #tooltip .name { font-weight: bold; margin-bottom: 4px; font-size: 13px; }
</style>
</head>

// ============== 设置 ==============
const width = 960;
const radius = width / 6;

const palette = d3.schemeTableau10; // 色盲友好

// 顶层分类着色,子节点继承父色并按深度调亮度
const root = d3.hierarchy(data)
  .sum(d => d.value)
  .sort((a, b) => b.value - a.value);

// 给每个顶层子节点分配色相
const topGroups = root.children;
topGroups.forEach((d, i) => { d.colorIndex = i; });
let focusNode = root; // 当前聚焦节点

function colorOf(d) {
  if (d.depth === 0) return "#aaa";
  let p = d;
  while (p.parent && p.parent !== focusNode) p = p.parent;
  if (!p.parent) {
    p = d;
    while (p.depth > 1) p = p.parent;
  }
  const colorIndex = focusNode.children
    ? focusNode.children.indexOf(p)
    : 0;
  const base = palette[Math.max(0, colorIndex) % palette.length];
  const c = d3.lab(base);
  const relativeDepth = d.depth - p.depth;
  c.l = Math.min(95, c.l + relativeDepth * 8);
  return c.formatHex();
}

d3.partition().size([2 * Math.PI, root.height + 1])(root);
root.each(d => d.current = d);

const svg = d3.select("#chart");
svg.style("font", "10px sans-serif");

const arc = d3.arc()
  .startAngle(d => d.x0)
  .endAngle(d => d.x1)
  .padAngle(d => Math.min((d.x1 - d.x0) / 2, 0.005))
  .padRadius(radius * 1.5)
  .innerRadius(d => d.y0 * radius)
  .outerRadius(d => Math.max(d.y0 * radius, d.y1 * radius - 1));

const path = svg.append("g")
  .selectAll("path")
  .data(root.descendants().slice(1))
  .join("path")
  .attr("class", "arc")
  .attr("fill", d => colorOf(d))
  .attr("fill-opacity", d => arcVisible(d.current) ? (d.children ? 0.85 : 0.65) : 0)
  .attr("pointer-events", d => arcVisible(d.current) ? "auto" : "none")
  .attr("d", d => arc(d.current));

path.filter(d => d.children).style("cursor", "pointer").on("click", clicked);

// ============== Tooltip ==============
const tooltip = d3.select("#tooltip");
const totalValue = root.value;
path.on("mouseover", (event, d) => {
  const parentValue = d.parent ? d.parent.value : totalValue;
  const pctParent = ((d.value / parentValue) * 100).toFixed(1);
  const pctTotal = ((d.value / totalValue) * 100).toFixed(1);
  tooltip.html(`
    <div class="name">${d.data.name}</div>
    <div>路径:${d.ancestors().map(a => a.data.name).reverse().slice(1).join(" / ")}</div>
    <div>值:<b>${d.value.toLocaleString()}</b></div>
    <div>占父级:<b>${pctParent}%</b></div>
    <div>占总体:<b>${pctTotal}%</b></div>
    <div>子节点数:<b>${d.children ? d.children.length : 0}</b></div>
  `).style("visibility", "visible");
})
.on("mousemove", (e) => tooltip.style("left", (e.pageX + 14) + "px").style("top", (e.pageY + 14) + "px"))
.on("mouseout", () => tooltip.style("visibility", "hidden"));

// ============== 弧上标签(自适应,弧角足够大才显示) ==============

  .attr("pointer-events", "none")
  .attr("text-anchor", "middle")
  .style("user-select", "none")
  .selectAll("text")

  .join("text")
  .attr("class", "label")
  .attr("dy", "0.35em")
  .style("opacity", d => labelVisible(d.current) ? 1 : 0)
  .attr("transform", d => labelTransform(d.current))
  .text(d => d.data.name);

// ============== 中心圆(回退用)+ 信息卡 ==============
const parentCircle = svg.append("circle")

// ============== 百分比环形刻度条 ==============
const pctInnerR = 130;
const pctOuterR = 148;
const pctLabelR = 118;
const MIN_ARC_RAD = 10 * Math.PI / 180;

const pctArcGen = d3.arc()
  .innerRadius(pctInnerR)
  .outerRadius(pctOuterR)
  .padAngle(0.008);

function buildPctData(node) {
  if (!node.children) return [];
  return node.children.map((child, i) => ({
    key: child.data.name,
    pct: child.value / totalValue,
    startAngle: child.x0,
    endAngle: child.x1,
    colorIndex: i
  }));
}

function pctLabelTransform(d) {
  const mid = (d.startAngle + d.endAngle) / 2;
  return `translate(${Math.sin(mid) * pctLabelR},${-Math.cos(mid) * pctLabelR})`;
}

const pctRingG = svg.append("g").attr("class", "pct-ring-group");

pctRingG.selectAll("path")
  .data(buildPctData(root), d => d.key)
  .join("path")
  .attr("class", "pct-ring")
  .attr("fill", d => palette[d.colorIndex % palette.length])
  .attr("fill-opacity", 0.9)
  .attr("d", d => pctArcGen(d))
  .each(function(d) { this.__prev__ = {...d}; });

pctRingG.selectAll("text.pct-label")
  .data(buildPctData(root).filter(d => (d.endAngle - d.startAngle) >= MIN_ARC_RAD), d => d.key)
  .join("text")
  .attr("class", "pct-label")
  .attr("dy", "0.35em")
  .attr("transform", d => pctLabelTransform(d))
  .text(d => (d.pct * 100).toFixed(1) + "%")
  .each(function(d) { this.__prev__ = {...d}; });

function updatePctRing(node, transition) {
  const data = buildPctData(node);

  pctRingG.selectAll("path")
    .data(data, d => d.key)
    .join(
      enter => enter.append("path")
        .attr("class", "pct-ring")
        .attr("fill", d => palette[d.colorIndex % palette.length])
        .attr("fill-opacity", 0)
        .attr("d", d => pctArcGen(d))
        .call(e => e.transition(transition).attr("fill-opacity", 0.9)),
      update => update
        .call(u => u.transition(transition)
          .attr("fill", d => palette[d.colorIndex % palette.length])
          .attrTween("d", function(d) {
            const prev = this.__prev__ || d;
            const iS = d3.interpolate(prev.startAngle, d.startAngle);
            const iE = d3.interpolate(prev.endAngle, d.endAngle);
            return t => pctArcGen({...d, startAngle: iS(t), endAngle: iE(t)});
          })
          .attr("fill-opacity", 0.9)),
      exit => exit.call(e => e.transition(transition).attr("fill-opacity", 0).remove())
    )
    .each(function(d) { this.__prev__ = {...d}; });

  const visible = data.filter(d => (d.endAngle - d.startAngle) >= MIN_ARC_RAD);
  pctRingG.selectAll("text.pct-label")
    .data(visible, d => d.key)
    .join(
      enter => enter.append("text")
        .attr("class", "pct-label")
        .attr("dy", "0.35em")
        .attr("fill-opacity", 0)
        .attr("transform", d => pctLabelTransform(d))
        .text(d => (d.pct * 100).toFixed(1) + "%")
        .call(e => e.transition(transition).attr("fill-opacity", 1)),
      update => update
        .call(u => u.transition(transition)
          .attrTween("transform", function(d) {
            const prev = this.__prev__ || d;
            const prevMid = (prev.startAngle + prev.endAngle) / 2;
            const newMid = (d.startAngle + d.endAngle) / 2;
            const interp = d3.interpolate(prevMid, newMid);
            return t => {
              const mid = interp(t);
              return `translate(${Math.sin(mid) * pctLabelR},${-Math.cos(mid) * pctLabelR})`;
            };
          })
          .text(d => (d.pct * 100).toFixed(1) + "%")
          .attr("fill-opacity", 1)),
      exit => exit.call(e => e.transition(transition).attr("fill-opacity", 0).remove())
    )
    .each(function(d) { this.__prev__ = {...d}; });
}

const centerInfo = svg.append("g").attr("id", "center-info");
centerInfo.append("text").attr("class", "title").attr("y", -6).text(root.data.name);
centerInfo.append("text").attr("class", "value").attr("y", 14).text(`${root.value.toLocaleString()}`);
centerInfo.append("text").attr("class", "value").attr("y", 30).text(`${root.children.length} 个顶层分类`);

// ============== 面包屑 ==============
let currentRoot = root;
function updateBreadcrumb(node) {
  const trail = node.ancestors().reverse();
  const bc = d3.select("#breadcrumb").html("当前位置:");
  trail.forEach((n, i) => {
    if (i > 0) bc.append("span").attr("class", "sep").text("›");
    bc.append("span").attr("class", "crumb").text(n.data.name).on("click", () => clicked(null, n));
  });
}
updateBreadcrumb(root);

// ============== 图例(动态) ==============
function updateLegend(node) {
  const legend = d3.select("#legend").html("");
  const groups = node.children || topGroups;
  const label = node === root ? "顶层分类:" : `${node.data.name} 子分类:`;
  legend.append("span").style("color", "#666").style("margin-right", "8px").text(label);
  groups.forEach((d, i) => {
    legend.append("span")
      .attr("class", "legend-item")
      .html(`<span class="legend-swatch" style="background:${palette[i % palette.length]}"></span>${d.data.name}`);
  });
}
updateLegend(root);

// ============== 点击钻取 ==============
function clicked(event, p) {
  parentCircle.datum(p.parent || root);
  currentRoot = p;
  focusNode = p;
  updateBreadcrumb(p);
  updateLegend(p);

  // 更新中心信息卡
  centerInfo.select(".title").text(p.data.name);
  centerInfo.select(".value:nth-of-type(2)").text(`${p.value.toLocaleString()}`);
  const totalPct = ((p.value / totalValue) * 100).toFixed(1);
  centerInfo.selectAll(".value").filter((d,i) => i === 1).text(`占总体 ${totalPct}%`);

  root.each(d => d.target = {
    x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
    x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
    y0: Math.max(0, d.y0 - p.depth),
    y1: Math.max(0, d.y1 - p.depth)
  });

  const t = svg.transition().duration(750);
  path.transition(t)
    .tween("data", d => {
      const i = d3.interpolate(d.current, d.target);
      return tt => d.current = i(tt);
    })
    .filter(function(d) {
      return +this.getAttribute("fill-opacity") || arcVisible(d.target);
    })
    .attr("fill-opacity", d => arcVisible(d.target) ? (d.children ? 0.85 : 0.65) : 0)
    .attr("pointer-events", d => arcVisible(d.target) ? "auto" : "none")
    .attrTween("fill", function(d) {
      const oldColor = d3.color(this.getAttribute("fill"));
      const newColor = d3.color(colorOf(d));
      if (!oldColor || !newColor) return () => colorOf(d);
      const interp = d3.interpolate(oldColor, newColor);
      return tt => interp(tt);
    })
    .attrTween("d", d => () => arc(d.current));

  label.filter(function(d) {
    return +this.style.opacity || labelVisible(d.target);
  }).transition(t)
    .style("opacity", d => labelVisible(d.target) ? 1 : 0)
    .attrTween("transform", d => () => labelTransform(d.current));

  updatePctRing(p, t);
}

function arcVisible(d) {
  return d.y1 <= 3 && d.y0 >= 1 && d.x1 > d.x0;
}
function labelVisible(d) {
  return d.y1 <= 3 && d.y0 >= 1 && (d.y1 - d.y0) * (d.x1 - d.x0) > 0.03;
}
function labelTransform(d) {
  const x = (d.x0 + d.x1) / 2 * 180 / Math.PI;
  const y = (d.y0 + d.y1) / 2 * radius;
  return `rotate(${x - 90}) translate(${y},0) rotate(${x < 180 ? 0 : 180})`;
}

// ============== 重置 ==============
d3.select("#reset").on("click", () => clicked(null, root));
</script>
</body>
