name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'chart1/**'
      - 'chart2/**'
      - 'chart3/**'
      - 'chart4/**'
      - 'index.html'
      - '.github/workflows/deploy-GitHub-Pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build chart4
        run: |
          cd chart4
          bun install
          bun run build

      - name: Assemble all projects site
        run: |
          mkdir -p _site/chart1 _site/chart2 _site/chart3 _site/chart4
          cp index.html _site/
          cp chart1/chart1.html _site/chart1/
          cp chart2/chart2.html _site/chart2/
          cp chart3/quakespotter_v0.4.html _site/chart3/
          cp chart4/dist/index.html _site/chart4/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@main
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@main
